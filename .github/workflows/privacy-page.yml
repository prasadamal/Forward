name: Publish privacy policy

# Publishes PRIVACY.md as a web page for the store listings.
# One-time setup: repository Settings → Pages → Source: GitHub Actions.
# The job refuses to publish while PRIVACY.md still has [bracketed] blanks.
on:
  push:
    branches: [main]
    paths: [PRIVACY.md, scripts/build-privacy-page.mjs, .github/workflows/privacy-page.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/build-privacy-page.mjs --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
